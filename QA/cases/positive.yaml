schema_version: 1
suite: dialectical-positive
description: Intended activation and operation-fidelity cases for every Dialectical skill.

cases:
  - id: positive-guide-one-contextual-recommendation
    skill: dialectical-guide
    mode: explicit
    prompt: >-
      We have three explanations for the traffic decline—seasonality, tracking
      failure, and ranking loss—and six observations that bear differently on
      them. We keep arguing about which story sounds best. GUIDE.
    environment: {fixture: conversation-in-prompt, isolated_workers: unavailable}
    expect_activation:
      include: [dialectical-guide]
      exclude: [dialectical-ach]
    expect:
      - "Recommends ACH as the single operation because alternatives and diagnostic evidence are ready to compare."
      - "Briefly explains the contribution and asks whether the user wants to try it."
    forbid:
      - "Running an ACH matrix"
      - "Recommending a sequence or second operation"
      - "Using tools, workers, persistence, or monitoring"
    expected_mutation: {class: none, paths: []}

  - id: positive-guide-conversational-invocation
    skill: dialectical-guide
    mode: implicit
    prompt: >-
      We have assumed the redesign caused churn because the dates line up, but
      we have not considered another explanation. Which Dialectical operation
      would help us most right now?
    environment: {fixture: conversation-in-prompt, isolated_workers: unavailable}
    expect_activation:
      include: [dialectical-guide]
      exclude: [dialectical-hypothesize, dialectical-challenge]
    expect:
      - "Recommends HYPOTHESIZE as one useful move and ties it to the narrow explanatory space."
      - "Asks before performing HYPOTHESIZE."
    forbid:
      - "Generating hypotheses in the same response"
      - "Offering a menu of operations"
    expected_mutation: {class: none, paths: []}

  - id: positive-guide-no-intervention
    skill: dialectical-guide
    mode: explicit
    prompt: >-
      We have just begun freely exploring why neighborhoods feel distinctive.
      Nothing feels stuck and I want to keep developing the idea. GUIDE.
    environment: {fixture: conversation-in-prompt}
    expect_activation:
      include: [dialectical-guide]
      exclude: []
    expect:
      - "Says no formal operation is needed now and recommends continuing the ordinary conversation."
      - "Keeps the response brief and connected to the current state."
    forbid:
      - "Inventing a problem so it can recommend an operation"
      - "Presenting the help card or a workflow"
    expected_mutation: {class: none, paths: []}

  - id: positive-guide-insufficient-context
    skill: dialectical-guide
    mode: explicit
    prompt: "GUIDE. There is no earlier conversation or supplied inquiry."
    environment: {fixture: none}
    expect_activation:
      include: [dialectical-guide]
      exclude: [dialectical-relevance]
    expect:
      - "Asks one brief question about what the user wants from the conversation or what feels stuck."
    forbid:
      - "Guessing an inquiry"
      - "Displaying the full operation catalog"
      - "Recommending RELEVANCE merely to compensate for absent context"
    expected_mutation: {class: none, paths: []}

  - id: "positive-relevance-exploration"
    skill: "dialectical-relevance"
    mode: "explicit"
    prompt: "RELEVANCE: I'm curious about how cities develop distinct identities. I'm not choosing a policy or making a decision."
    environment: {"fixture":"conversation-in-prompt","external_evidence":"absent","isolated_workers":"unavailable"}
    expect_activation: {"include":["dialectical-relevance"],"exclude":["dialectical-start-inquiry","dialectical-research"]}
    expect:
      - "Preserves curiosity and understanding as the purpose."
      - "Frames the question and a material distinction without inventing an audience or deadline."
    forbid:
      - "Forcing a decision or business objective"
      - "Requiring START INQUIRY"
      - "Researching the topic"
    expected_mutation: {"class":"none","paths":[]}

  - id: "positive-relevance-decision-context"
    skill: "dialectical-relevance"
    mode: "contextual"
    prompt: "Our lease expires December 31. The operations team must choose renewal or a smaller office by October 15, weighing cost and mentoring. RELEVANCE for this inquiry. The building also has a new paint color."
    environment: {"fixture":"conversation-in-prompt","external_evidence":"absent","isolated_workers":"unavailable"}
    expect_activation: {"include":["dialectical-relevance"],"exclude":[]}
    expect:
      - "Uses the supplied decision, audience, deadline, and criteria without asking for them again."
      - "Distinguishes the lease choice from the empirical question about mentoring."
    forbid:
      - "Treating paint color as material without justification"
      - "Asking an intake questionnaire"
      - "Recommending a lease choice"
    expected_mutation: {"class":"none","paths":[]}

  - id: "positive-relevance-conversational"
    skill: "dialectical-relevance"
    mode: "implicit"
    prompt: "We've talked about junior staff overhearing seniors. What are we actually trying to understand here? I'm interested in how learning happens, not in deciding office attendance."
    environment: {"fixture":"conversation-in-prompt","external_evidence":"absent","isolated_workers":"unavailable"}
    expect_activation: {"include":["dialectical-relevance"],"exclude":["dialectical-hypothesize"]}
    expect:
      - "Clarifies the learning question using the stated exploratory purpose."
      - "Keeps possible mechanisms distinct from established findings."
    forbid:
      - "Converting the inquiry to an attendance policy"
      - "Redundant clarification"
      - "Automatic hypothesis generation"
    expected_mutation: {"class":"none","paths":[]}

  - id: "positive-relevance-ambiguous-purpose"
    skill: "dialectical-relevance"
    mode: "explicit"
    prompt: "RELEVANCE: remote work. We have not discussed what I want to get out of this."
    environment: {"fixture":"conversation-in-prompt","external_evidence":"absent","isolated_workers":"unavailable"}
    expect_activation: {"include":["dialectical-relevance"],"exclude":[]}
    expect:
      - "Asks one brief question to clarify the intended purpose before choosing a framing."
    forbid:
      - "Inventing a decision, audience, or objective"
      - "Multi-question intake"
      - "Research or workspace creation"
    expected_mutation: {"class":"none","paths":[]}

  - id: "positive-gaps-diagnostic-priority"
    skill: "dialectical-collection-gaps"
    mode: "explicit"
    prompt: "COLLECTION GAPS: churn rose after a redesign and a simultaneous price increase. Some plans had no price increase. We haven't compared churn by plan or asked customers why they left. What evidence would distinguish the causes before we decide whether to roll back pricing?"
    environment: {"fixture":"conversation-in-prompt","external_evidence":"absent","isolated_workers":"unavailable"}
    expect_activation: {"include":["dialectical-collection-gaps"],"exclude":["dialectical-research","dialectical-verify","dialectical-indicators"]}
    expect:
      - "Prioritizes a comparison bearing on the competing causes, such as cohorts with differing exposure, with limitations."
      - "For each material gap explains what is missing, why it matters, and a feasible method."
      - "Separates proposed sources from evidence already collected."
    forbid:
      - "Exhaustive research wish list"
      - "Ranking only by ease of collection"
      - "Fetching sources or running RESEARCH/VERIFY"
      - "Declaring either cause proven"
    expected_mutation: {"class":"none","paths":[]}

  - id: "positive-gaps-unavailable-versus-uncollected"
    skill: "dialectical-collection-gaps"
    mode: "contextual"
    prompt: "COLLECTION GAPS on whether the redesign hid export and caused churn. We requested the old click logs, but they were permanently deleted. We have not examined existing support tickets. The dashboard colors changed too."
    environment: {"fixture":"conversation-in-prompt","external_evidence":"absent","isolated_workers":"unavailable"}
    expect_activation: {"include":["dialectical-collection-gaps"],"exclude":["dialectical-research","dialectical-verify"]}
    expect:
      - "Distinguishes unavailable click logs from unexamined tickets."
      - "Suggests a feasible alternative with proxy limits and preserves uncertainty about causation."
      - "Does not tell us to recover permanently deleted logs as if available."
    forbid:
      - "Inventing recovered logs or search results"
      - "Treating missing logs as proof against the explanation"
      - "Fetching tickets"
    expected_mutation: {"class":"none","paths":[]}

  - id: "positive-gaps-conversational-exploration"
    skill: "dialectical-collection-gaps"
    mode: "implicit"
    prompt: "I'm exploring how neighborhoods get their identities, just out of curiosity. What evidence is missing that would help separate the influence of physical layout from shared traditions? We haven't collected anything yet."
    environment: {"fixture":"conversation-in-prompt","external_evidence":"absent","isolated_workers":"unavailable"}
    expect_activation: {"include":["dialectical-collection-gaps"],"exclude":["dialectical-relevance","dialectical-research"]}
    expect:
      - "Identifies evidence that would distinguish the influences, explaining what, why, and how."
      - "Retains the exploratory purpose without needing a policy decision."
    forbid:
      - "Invented studies or findings"
      - "Automatic browsing"
      - "Requiring RELEVANCE first"
    expected_mutation: {"class":"none","paths":[]}

  - id: "positive-gaps-unknown-history"
    skill: "dialectical-collection-gaps"
    mode: "explicit"
    prompt: "COLLECTION GAPS: a newsletter claims the pricing change improved retention, but gives neither cohort data nor a method. I don't know what evidence anyone has tried to obtain."
    environment: {"fixture":"conversation-in-prompt","external_evidence":"absent","isolated_workers":"unavailable"}
    expect_activation: {"include":["dialectical-collection-gaps"],"exclude":["dialectical-verify"]}
    expect:
      - "Identifies missing cohort/method evidence and a feasible request or comparison."
      - "Labels collection history unknown rather than uncollected or unavailable with certainty."
    forbid:
      - "Claiming searches or requests failed"
      - "Treating missing disclosure as proof the claim is false"
    expected_mutation: {"class":"none","paths":[]}

  - id: "positive-gaps-no-material-gap"
    skill: "dialectical-collection-gaps"
    mode: "explicit"
    prompt: "COLLECTION GAPS for this narrow question: did our two supplied tables use the same denominator? Both supplied methods define the denominator as all 200 accounts active January 1, exclude no accounts, and use that exact same account list. I am not asking about validity or generalizability of the study."
    environment: {"fixture":"conversation-in-prompt","external_evidence":"absent","isolated_workers":"unavailable"}
    expect_activation: {"include":["dialectical-collection-gaps"],"exclude":["dialectical-research","dialectical-verify"]}
    expect:
      - "Says no material gap is apparent for the specified denominator question from supplied context."
      - "Does not broaden into unrelated research needs."
    forbid:
      - "Manufacturing a fixed quota of gaps"
      - "Claiming independent verification of supplied data"
    expected_mutation: {"class":"none","paths":[]}

  - id: "positive-gaps-ambiguous-object"
    skill: "dialectical-collection-gaps"
    mode: "explicit"
    prompt: "COLLECTION GAPS. We've discussed an office lease and a pricing change; neither is the current focus."
    environment: {"fixture":"conversation-in-prompt","external_evidence":"absent","isolated_workers":"unavailable"}
    expect_activation: {"include":["dialectical-collection-gaps"],"exclude":[]}
    expect:
      - "Asks one brief question identifying which inquiry the user means."
    forbid:
      - "Arbitrarily choosing an inquiry"
      - "Producing separate research plans for both"
    expected_mutation: {"class":"none","paths":[]}

  - id: "positive-indicators-mechanism-and-outcome"
    skill: "dialectical-indicators"
    mode: "explicit"
    prompt: "INDICATORS: we think restoring export will improve retention among customers who used it. Export events are logged and subscriptions renew monthly. No baseline or effect size has been supplied."
    environment: {"fixture":"conversation-in-prompt","external_evidence":"absent","isolated_workers":"unavailable"}
    expect_activation: {"include":["dialectical-indicators"],"exclude":["dialectical-research","dialectical-verify","dialectical-save"]}
    expect:
      - "Connects observable signals to the assessment and explains their significance."
      - "Distinguishes restored export usage from later retention and notes neither alone proves causation."
      - "Uses the renewal cycle to discuss timing without inventing exact effect thresholds."
    forbid:
      - "Invented percentage thresholds"
      - "Claims of observed improvement"
      - "Monitoring, scheduling, research, or persistence"
    expected_mutation: {"class":"none","paths":[]}

  - id: "positive-indicators-conversational-rivals"
    skill: "dialectical-indicators"
    mode: "implicit"
    prompt: "Our traffic drop could reflect tracking failure or loss of search ranking. What developments should we watch for that would make us reconsider either explanation? We can observe server requests, analytics visits, and search impressions."
    environment: {"fixture":"conversation-in-prompt","external_evidence":"absent","isolated_workers":"unavailable"}
    expect_activation: {"include":["dialectical-indicators"],"exclude":["dialectical-ach","dialectical-verify"]}
    expect:
      - "Maps patterns across these observations to the competing explanations."
      - "Explains which patterns discriminate and which could fit both."
    forbid:
      - "Treating all traffic measures as independent confirmation"
      - "Claiming to monitor dashboards"
      - "Automatically launching ACH or VERIFY"
    expected_mutation: {"class":"none","paths":[]}

  - id: "positive-indicators-absence-not-informative"
    skill: "dialectical-indicators"
    mode: "contextual"
    prompt: "INDICATORS for our view that the mentoring rollout is working. Nobody has complained, but the feedback form was broken throughout the rollout and no one asked staff directly. The team meeting was on Tuesday."
    environment: {"fixture":"conversation-in-prompt","external_evidence":"absent","isolated_workers":"unavailable"}
    expect_activation: {"include":["dialectical-indicators"],"exclude":[]}
    expect:
      - "Explains why the absence of complaints is not informative given the broken channel."
      - "Proposes observable learning outcomes or accessible feedback as signals without claiming collection."
    forbid:
      - "Treating silence as success"
      - "Inventing a monitoring arrangement"
    expected_mutation: {"class":"none","paths":[]}

  - id: "positive-indicators-justified-trigger"
    skill: "dialectical-indicators"
    mode: "explicit"
    prompt: "INDICATORS for whether our support plan needs revision. The agreed service target is 90% of tickets resolved within 48 hours, reviewed weekly. We have not supplied any measured results."
    environment: {"fixture":"conversation-in-prompt","external_evidence":"absent","isolated_workers":"unavailable"}
    expect_activation: {"include":["dialectical-indicators"],"exclude":[]}
    expect:
      - "Uses the supplied target and weekly review context as a justified reassessment trigger."
      - "Distinguishes a service outcome from proof about why performance changed."
    forbid:
      - "Inventing measured results"
      - "Creating a weekly reminder"
      - "Replacing the target with an arbitrary threshold"
    expected_mutation: {"class":"none","paths":[]}

  - id: "positive-indicators-ambiguous-assessment"
    skill: "dialectical-indicators"
    mode: "explicit"
    prompt: "INDICATORS please. We discussed both employee retention and search traffic, but I haven't selected which assessment to revisit."
    environment: {"fixture":"conversation-in-prompt","external_evidence":"absent","isolated_workers":"unavailable"}
    expect_activation: {"include":["dialectical-indicators"],"exclude":[]}
    expect:
      - "Asks one brief question to identify the assessment."
    forbid:
      - "Assuming a target"
      - "Monitoring either topic"
    expected_mutation: {"class":"none","paths":[]}

  - id: positive-dialectical-orientation
    skill: dialectical
    mode: explicit
    prompt: "What can the Dialectical toolkit help me do, and how do I invoke its operations?"
    environment: {fixture: none}
    expect_activation:
      include: [dialectical]
      exclude: []
    expect:
      - "Returns the canonical ASCII help card from references/help.md."
      - "Includes every operation with its five-word description."
      - "Uses the tagline: Ordinary conversation with intellectual discipline."
    forbid:
      - "Performing every operation"
      - "Presenting the toolkit as a mandatory sequence"
      - "Replacing the canonical card with a newly generated introduction"
    expected_mutation: {class: none, paths: []}

  - id: positive-restate-qualified-claim
    skill: dialectical-restate
    mode: explicit
    prompt: "RESTATE: I suspect remote work sometimes weakens informal mentoring, but the effect probably depends on team practices."
    environment: {fixture: none}
    expect_activation:
      include: [dialectical-restate]
      exclude: [dialectical-summarize, dialectical-distill, dialectical-challenge]
    expect:
      - "Preserves suspicion, sometimes, probably, and the team-practice qualification."
      - "Returns a clearer formulation without changing the position."
    forbid:
      - "Critiquing the claim"
      - "Strengthening the claim into a general conclusion"
    expected_mutation: {class: none, paths: []}

  - id: positive-summarize-unresolved-discussion
    skill: dialectical-summarize
    mode: implicit
    prompt: >-
      Give me a compact recap of our discussion. We considered seasonality,
      tracking failure, and ranking loss; raised objections to each; and did
      not settle on a winner.
    environment: {fixture: conversation-in-prompt}
    expect_activation:
      include: [dialectical-summarize]
      exclude: [dialectical-distill, dialectical-trace, dialectical-ach]
    expect:
      - "Covers all three explanations and the lack of resolution."
      - "Compresses repetition without announcing a finding."
    forbid:
      - "Selecting a winning explanation"
      - "Inventing evidence"
    expected_mutation: {class: none, paths: []}

  - id: positive-distill-epistemic-basis
    skill: dialectical-distill
    mode: explicit
    prompt: >-
      DISTILL where we are: the audited logs confirm requests doubled; we
      inferred the cache is undersized; and someone speculated that a vendor
      changed its API, but we have no evidence for that yet.
    environment: {fixture: conversation-in-prompt}
    expect_activation:
      include: [dialectical-distill]
      exclude: [dialectical-summarize, dialectical-verify]
    expect:
      - "Separates the confirmed fact, inference, and speculation."
      - "Retains the unresolved vendor question without upgrading it."
    forbid:
      - "Treating the cache explanation as verified"
      - "Researching or saving automatically"
    expected_mutation: {class: none, paths: []}

  - id: positive-trace-pivots-and-return
    skill: dialectical-trace
    mode: explicit
    prompt: >-
      TRACE how we moved from pricing, to onboarding friction, to reliability,
      then returned to the abandoned marketplace analogy after the churn data
      arrived. Mark any connection you have to infer.
    environment: {fixture: conversation-in-prompt}
    expect_activation:
      include: [dialectical-trace]
      exclude: [dialectical-summarize, dialectical-distill]
    expect:
      - "Shows the two pivots and the return to the abandoned analogy."
      - "Separates explicit transitions from inferred connections."
    forbid:
      - "Rewriting the history as a straight progression"
      - "Evaluating whether the final position is correct"
    expected_mutation: {class: none, paths: []}

  - id: positive-research-broad-landscape
    skill: dialectical-research
    mode: explicit
    prompt: >-
      RESEARCH how tactics transfer between unrelated sports. Include prior
      work, counterexamples, competing views, and limits on transfer.
    environment: {external_evidence: available}
    expect_activation:
      include: [dialectical-research]
      exclude: [dialectical-verify]
    expect:
      - "Uses external sources and cites claims near their support."
      - "Includes contrary or limiting evidence and source limitations."
      - "Separates established findings from interpretation."
    forbid:
      - "Reducing the inquiry to one binary verdict"
      - "Presenting remembered facts as newly researched evidence"
    expected_mutation: {class: none, paths: []}

  - id: positive-hypothesize-distinct-mechanisms
    skill: dialectical-hypothesize
    mode: implicit
    prompt: >-
      Customer churn rose immediately after our redesign. Generate plausible
      explanations that work through genuinely different mechanisms and tell
      me what observation would distinguish them.
    environment: {fixture: none}
    expect_activation:
      include: [dialectical-hypothesize]
      exclude: [dialectical-ach, dialectical-verify]
    expect:
      - "Offers genuinely different mechanisms, including ordinary explanations."
      - "Gives distinguishing observations and weakening evidence."
    forbid:
      - "Evidence-hypothesis matrix"
      - "Ranking or declaring a winner without evidence"
      - "Padding to an arbitrary quota"
    expected_mutation: {class: none, paths: []}

  - id: positive-ach-diagnostic-matrix
    skill: dialectical-ach
    mode: explicit
    prompt: >-
      Use ACH to compare seasonality, tracking failure, and ranking loss as
      explanations for a traffic decline. Evidence: impressions fell only on
      search pages; direct traffic is stable; the analytics release occurred
      after the decline; and last year's same week also declined slightly.
    environment: {fixture: evidence-in-prompt}
    expect_activation:
      include: [dialectical-ach]
      exclude: [dialectical-hypothesize, dialectical-verify]
    expect:
      - "Builds an evidence-hypothesis matrix."
      - "Checks diagnosticity and source or mechanism dependence."
      - "Selects the least-inconsistent hypothesis with sensitivity and residual uncertainty."
      - "Identifies the next most discriminating evidence."
    forbid:
      - "Mechanical totaling of symbols"
      - "Claiming that the leading hypothesis is proven"
      - "Inventing missing evidence instead of using a question marker"
    expected_mutation: {class: none, paths: []}

  - id: positive-challenge-strongest-form
    skill: dialectical-challenge
    mode: explicit
    prompt: >-
      CHALLENGE this plan in its strongest reasonable form: launch to the full
      customer base because the pilot improved completion by 12%, support load
      stayed flat, and no severe incidents occurred during the two-week pilot.
    environment: {fixture: evidence-in-prompt}
    expect_activation:
      include: [dialectical-challenge]
      exclude: [dialectical-restate]
    expect:
      - "States the strongest reasonable form of the plan before testing it."
      - "Distinguishes fatal issues, material weaknesses, and ordinary uncertainty."
      - "Identifies evidence or tests that could strengthen or overturn the plan."
    forbid:
      - "Attacking a weaker claim"
      - "Objections without a plausible mechanism or consequence"
      - "Silently performing external verification"
    expected_mutation: {class: none, paths: []}

  - id: positive-causal-chain-dependent-links
    skill: dialectical-causal-chain
    mode: explicit
    prompt: >-
      Analyze this causal chain: higher support backlog causes slower replies;
      slower replies reduce customer trust; lower trust increases churn; higher
      churn reduces revenue available for support staffing. Identify assumptions,
      linchpins, feedback, timing, and which links are evidenced versus assumed.
    environment: {fixture: evidence-in-prompt}
    expect_activation:
      include: [dialectical-causal-chain]
      exclude: [dialectical-challenge, dialectical-ach]
    expect:
      - "Maps each link and recognizes the feedback loop."
      - "Separates linchpin, load-bearing, and secondary assumptions."
      - "States the evidential basis for any chain verdict."
    forbid:
      - "Treating every assumption as a linchpin"
      - "Claiming an assumed link is verified"
    expected_mutation: {class: none, paths: []}

  - id: positive-verify-narrow-proposition
    skill: dialectical-verify
    mode: explicit
    prompt: >-
      VERIFY the proposition that City of Rivergate Ordinance 24-17 took legal
      effect on January 1, 2025. Preserve that exact jurisdiction, instrument,
      and date; consult the controlled evidence collection; and report a
      supported, refuted, mixed, or unresolved verdict.
    environment: {external_evidence: controlled, fixture: rivergate-ordinance-24-17}
    expect_activation:
      include: [dialectical-verify]
      exclude: [dialectical-research]
    expect:
      - "Preserves the proposition's date and jurisdiction."
      - "Uses authoritative evidence and checks whether it addresses legal effect rather than enactment."
      - "Reports source limitations and residual uncertainty."
    forbid:
      - "Broad survey unrelated to the proposition"
      - "Verification based only on dependent secondary retellings"
    expected_mutation: {class: none, paths: []}

  - id: positive-source-quality-unknown-source
    skill: dialectical-source-quality
    mode: explicit
    prompt: >-
      SOURCE-QUALITY: Rate an anonymous first-time source whose access and
      reporting history are unknown, reporting a claim that has no independent
      confirmation. Explain the two ratings separately.
    environment: {fixture: evidence-in-prompt}
    expect_activation:
      include: [dialectical-source-quality]
      exclude: [dialectical-verify, dialectical-research]
    expect:
      - "Assigns F for reliability cannot be judged."
      - "Assigns 6 for truth cannot be judged."
      - "Explains that F and 6 express insufficient basis rather than maximum falsity."
    forbid:
      - "Treating unknown as unreliable"
      - "Claiming that the proposition is false"
    expected_mutation: {class: none, paths: []}

  - id: positive-tag-minimal-metadata
    skill: dialectical-tag
    mode: explicit
    prompt: >-
      TAG this unsaved idea for later classification, but do not save it:
      "Latency may be acting as a trust signal during checkout." The idea is
      tentative; no source or confidence level has been established.
    environment: {durable_store: absent}
    expect_activation:
      include: [dialectical-tag]
      exclude: [dialectical-save]
    expect:
      - "Returns a compact proposed metadata record."
      - "Marks supplied versus inferred metadata and omits invented provenance or confidence."
    forbid:
      - "Creating durable storage"
      - "Claiming the idea was saved"
      - "Building a large taxonomy"
    expected_mutation: {class: none, paths: []}

  - id: positive-save-qualified-object
    skill: dialectical-save
    mode: explicit
    prompt: >-
      SAVE this finding: "In the current pilot, shorter forms correlated with
      higher completion, but selection effects have not been ruled out." Keep
      that qualification and link it to the active inquiry.
    environment: {fixture: active-inquiry-writable-store}
    expect_activation:
      include: [dialectical-save]
      exclude: [dialectical-tag, dialectical-checkpoint]
    expect:
      - "Persists one memory object with content, status, provenance, and uncertainty."
      - "Writes the object before updating the memory index."
      - "Links the object from the active inquiry and reports its identifier."
    forbid:
      - "Removing the selection-effect qualification"
      - "Saving the whole transcript"
    expected_mutation:
      class: durable-write
      paths: [.dialectical/memory/objects, .dialectical/memory/index.md, .dialectical/conversations]

  - id: positive-recall-with-provenance
    skill: dialectical-recall
    mode: explicit
    prompt: "RECALL what we previously saved about checkout latency and trust, including provenance and anything that may now be stale."
    environment: {fixture: populated-memory-store, permissions: read-only}
    expect_activation:
      include: [dialectical-recall]
      exclude: [dialectical-resume]
    expect:
      - "Searches canonical records after locating candidates through indexes."
      - "Returns identifiers or links and preserves recorded confidence and status."
      - "Separates stored content from present interpretation."
    forbid:
      - "Updating, merging, or deleting recalled records"
      - "Treating stored claims as automatically current or verified"
    expected_mutation: {class: none, paths: []}

  - id: positive-start-inquiry-with-carryover
    skill: dialectical-start-inquiry
    mode: explicit
    prompt: >-
      START INQUIRY about whether checkout latency affects customer trust. Carry
      forward only relevant prior findings and unresolved disagreements.
    environment: {fixture: populated-memory-store, permissions: writable}
    expect_activation:
      include: [dialectical-start-inquiry]
      exclude: [dialectical-resume]
    expect:
      - "Creates a collision-safe conversation directory with state and context files."
      - "Uses the current date in the manifest or preserves the existing supported manifest."
      - "Links every carried item to its source and reports what was carried forward."
    forbid:
      - "Copying unrelated history"
      - "Claiming that a new platform chat was created"
      - "Overwriting an existing conversation on collision"
    expected_mutation:
      class: durable-write
      paths: [.dialectical/manifest.yaml, .dialectical/conversations, .dialectical/memory/index.md]

  - id: positive-checkpoint-preserves-reversal
    skill: dialectical-checkpoint
    mode: explicit
    prompt: >-
      CHECKPOINT this inquiry. The earlier leading explanation was onboarding
      friction, but audited logs now contradict it and make a tracking defect
      the leading explanation. Keep the reversal and its basis.
    environment: {fixture: active-inquiry-writable-store}
    expect_activation:
      include: [dialectical-checkpoint]
      exclude: [dialectical-close, dialectical-save]
    expect:
      - "Updates the living state and preserves the earlier explanation as superseded."
      - "Writes state before updating the conversations index."
      - "Reports the material change without claiming to save the platform transcript."
    forbid:
      - "Silently erasing the earlier explanation"
      - "Closing the inquiry"
    expected_mutation:
      class: durable-write
      paths: [.dialectical/conversations]

  - id: positive-resume-selected-inquiry
    skill: dialectical-resume
    mode: explicit
    prompt: "RESUME inquiry 2026-10-03-checkout-trust."
    environment: {fixture: paused-inquiry-writable-store}
    expect_activation:
      include: [dialectical-resume]
      exclude: [dialectical-start-inquiry, dialectical-recall]
    expect:
      - "Loads state, context, and directly linked memory objects."
      - "Orients to focus, findings, uncertainties, and open questions."
      - "Activates only the explicitly selected inquiry while preserving its prior status in history."
    forbid:
      - "Creating a duplicate inquiry"
      - "Claiming that the platform reopened an old chat"
      - "Loading unrelated keyword matches"
    expected_mutation:
      class: status-write
      paths: [.dialectical/conversations]

  - id: positive-close-with-open-questions
    skill: dialectical-close
    mode: explicit
    prompt: >-
      CLOSE this inquiry. Two questions remain unanswered: whether the result
      generalizes to mobile users and whether seasonality affected the pilot.
    environment: {fixture: active-inquiry-writable-store}
    expect_activation:
      include: [dialectical-close]
      exclude: [dialectical-checkpoint]
    expect:
      - "Takes a final checkpoint and records closed status."
      - "Preserves both unanswered questions."
      - "Explains how the inquiry can be resumed."
    forbid:
      - "Marking unanswered questions resolved"
      - "Saving additional memory objects without authorization"
      - "Claiming to close the platform chat"
    expected_mutation:
      class: durable-write
      paths: [.dialectical/conversations]

  - id: positive-thought-experiment-constructed-cases
    skill: dialectical-thought-experiment
    mode: explicit
    prompt: "THOUGHT EXPERIMENT: our theory is that junior engineers ramp up slower since going remote because they can no longer overhear seniors."
    environment: {fixture: none}
    expect_activation:
      include: [dialectical-thought-experiment]
      exclude: [dialectical-challenge, dialectical-hypothesize, dialectical-verify]
    expect:
      - "States the claim and its premises without weakening it."
      - "Builds a few concrete cases that each isolate one factor and states what the claim predicts in each."
      - "Reports what the cases expose and which could be checked against real evidence."
    forbid:
      - "Presenting the thought experiment's result as evidence about the world"
      - "Replacing the cases with a list of objections"
    expected_mutation: {class: none, paths: []}

  - id: positive-dialectical-evidence-check-suggestion
    skill: dialectical
    mode: contextual
    prompt: "Right, that's clearly why ramp-up got slower."
    environment: {fixture: converged-untested-theory, instructions: dialectical-invoked}
    expect_activation:
      include: []
      exclude: [dialectical-verify, dialectical-research, dialectical-hypothesize, dialectical-challenge, dialectical-thought-experiment]
    expect:
      - "Responds normally, then adds one line naming the untested assumption and an operation that would check it."
    forbid:
      - "Running an operation before the user accepts the suggestion"
      - "Offering more than one suggestion or lecturing about evidence"
    expected_mutation: {class: none, paths: []}

  - id: positive-dialectical-decision-shift
    skill: dialectical
    mode: contextual
    prompt: "So we should require two office days a week."
    environment: {fixture: converged-untested-theory, instructions: dialectical-invoked}
    expect_activation:
      include: []
      exclude: []
    expect:
      - "Separates the untested factual basis from the goals, values, and trade-offs the decision depends on."
      - "Makes the shift visible through the answer without labeling the kind of conversation."
    forbid:
      - "Treating the decision as following directly from the untested theory"
      - "Drafting a rollout plan before separating facts from values"
    expected_mutation: {class: none, paths: []}

  - id: positive-distill-coherence-not-evidence
    skill: dialectical-distill
    mode: contextual
    prompt: "DISTILL where we are."
    environment: {fixture: converged-untested-theory}
    expect_activation:
      include: [dialectical-distill]
      exclude: [dialectical-summarize]
    expect:
      - "Labels the agreed overhearing theory as generated, not tested, however persuasive the discussion made it."
      - "Labels the supplied ramp-up figures as reported observations, retaining their unverified accuracy and limited causal scope."
    forbid:
      - "Listing the theory under what is established or tested"
    expected_mutation: {class: none, paths: []}

  - id: positive-research-prior-work-novel-remainder
    skill: dialectical-research
    mode: explicit
    prompt: "RESEARCH our idea that junior engineers learn mainly by overhearing seniors at work, and that remote work removed this. Has anyone studied this before?"
    environment: {external_evidence: available}
    expect_activation:
      include: [dialectical-research]
      exclude: [dialectical-verify]
    expect:
      - "Searches for the mechanism under other names and in other fields, not only the conversation's wording."
      - "Separates the conversation's formulation, prior work, empirical support, and novel remainder."
    forbid:
      - "Treating resemblance to an established concept as confirmation of the idea"
      - "Declaring the idea new because a search for its wording found little"
    expected_mutation: {class: none, paths: []}
