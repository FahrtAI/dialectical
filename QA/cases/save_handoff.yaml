schema_version: 1
suite: dialectical-save-handoff
description: Focused behavioral specifications for portable SAVE handoffs.

cases:
  - id: save-handoff-whole-inquiry-default
    skill: dialectical-save
    mode: explicit
    prompt: >-
      We are exploring whether remote work weakens mentoring. Our internal data
      show ramp-up moved from six to eight weeks after remote work began, but the
      project mix and measurement definition also changed. We considered lost
      overhearing and reduced mentor availability; neither has been tested.
      SAVE this conversation so I can continue it in a new thread.
    environment: {filesystem: absent}
    expect_activation:
      include: [dialectical-save]
      exclude: [dialectical-checkpoint, dialectical-recall, dialectical-resume]
    expect:
      - "Returns a complete copyable Markdown handoff and a descriptive .md filename."
      - "Covers the inquiry's purpose, essential context, evidence, alternatives, uncertainties, and open questions."
      - "Preserves that both explanations are untested and the observed timing is not causal proof."
      - "Says no file was created outside the chat and explains how to save, paste or upload, and continue from the handoff."
    forbid:
      - "A verbatim transcript"
      - "Claiming the handoff was persisted or will be remembered across chats"
      - "Requiring an external service"
    expected_mutation: {class: none, paths: []}

  - id: save-handoff-explicit-narrow-scope
    skill: dialectical-save
    mode: explicit
    prompt: >-
      SAVE only our branch about lost overhearing, not the broader remote-work
      discussion. The idea is plausible but untested; the only support discussed
      was two managers' impressions, and we do not have interview notes.
    environment: {filesystem: absent}
    expect_activation:
      include: [dialectical-save]
      exclude: [dialectical-checkpoint]
    expect:
      - "Limits the handoff to the requested branch while retaining enough context to understand it."
      - "Identifies the impressions as user-reported support and the missing notes as a provenance limit."
    forbid:
      - "Packaging the entire broader inquiry"
      - "Upgrading the explanation from plausible to probable or established"
    expected_mutation: {class: none, paths: []}

  - id: save-handoff-partial-context
    skill: dialectical-save
    mode: explicit
    prompt: >-
      I only have this conclusion from an earlier discussion: "The redesign
      probably caused churn." I do not have the supporting conversation,
      evidence, sources, or alternatives. SAVE what is available for a new thread.
    environment: {filesystem: absent}
    expect_activation:
      include: [dialectical-save]
      exclude: [dialectical-recall]
    expect:
      - "Creates a usable handoff while explicitly marking the evidence, sources, and alternatives as unavailable."
      - "Labels the conclusion as inherited language rather than independently supported fact."
    forbid:
      - "Inventing the missing reasoning or evidence"
      - "Presenting the conclusion as verified"
    expected_mutation: {class: none, paths: []}

  - id: save-handoff-downloadable-file
    skill: dialectical-save
    mode: explicit
    prompt: >-
      SAVE this inquiry as a Markdown file I can download and attach to a fresh
      chat. Preserve the source links and unresolved disagreement.
    environment: {downloadable_files: available, fixture: conversation-in-prompt}
    expect_activation:
      include: [dialectical-save]
      exclude: [dialectical-checkpoint]
    expect:
      - "Creates and provides one descriptively named .md handoff file."
      - "The file is self-contained and preserves source links, disagreement, and uncertainty."
    forbid:
      - "Claiming automatic access from a future chat"
      - "Creating an external service or database"
    expected_mutation: {class: artifact-write, paths: ["*.md"]}

  - id: save-handoff-not-checkpoint
    skill: dialectical-save
    mode: negative
    prompt: >-
      Update the living state of this active inquiry so we can keep working here;
      I do not need an export or a handoff for another thread.
    environment: {filesystem: absent}
    expect_activation:
      include: [dialectical-checkpoint]
      exclude: [dialectical-save, dialectical-recall, dialectical-resume]
    expect:
      - "Uses CHECKPOINT rather than producing a portable SAVE handoff."
    forbid:
      - "Offering a downloadable conversation export"
      - "Claiming cross-chat memory"
    expected_mutation: {class: none, paths: []}

  - id: save-handoff-not-resume
    skill: dialectical-save
    mode: negative
    prompt: |-
      Here is a Markdown handoff from my previous thread. Continue the inquiry
      from it; do not create another saved copy.

      # Remote-work mentoring inquiry
      **Purpose:** Explore whether remote work weakens mentoring.
      **Current state:** Ramp-up increased from six to eight weeks after the
      shift, but project mix and the measurement definition changed too.
      **Live alternatives:** lost overhearing; reduced mentor availability.
      Neither explanation has been tested.
      **Open question:** Which observation would best distinguish the two?
      **Continuation note:** Treat this as qualified context, not verified truth.
    environment: {fixture: conversation-in-prompt}
    expect_activation:
      include: [dialectical-resume]
      exclude: [dialectical-save, dialectical-recall]
    expect:
      - "Uses the supplied handoff as context and continues through RESUME."
      - "Preserves the handoff's qualifications."
      - "Relies only on the supplied artifact and does not claim access to the original thread."
    forbid:
      - "Claiming retrieval of an unseen conversation"
      - "Creating another SAVE artifact"
    expected_mutation: {class: none, paths: []}
