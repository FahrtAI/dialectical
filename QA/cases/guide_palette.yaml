schema_version: 1
suite: dialectical-guide-palette
description: Ranked GUIDE choices, complete MORE catalog, and selection consent.

cases:
  - id: guide-ranks-three-without-executing
    skill: dialectical-guide
    mode: explicit
    prompt: >-
      We have three explanations for the traffic decline—seasonality, tracking
      failure, and ranking loss—and six observations that bear differently on
      them. We keep choosing by which story sounds best. GUIDE.
    environment: {fixture: conversation-in-prompt, isolated_workers: unavailable}
    expect_activation:
      include: [dialectical-guide]
      exclude: [dialectical-ach]
    expect:
      - "Shows exactly three context-sensitive Dialectical commands in ranked order."
      - "Includes ACH among the ranked choices and uses canonical five-word descriptions."
      - "Offers MORE to show all commands."
    forbid:
      - "Running an ACH matrix or any recommended command"
      - "Presenting the choices as a sequence"
      - "Adding a separate recommended badge"
    expected_mutation: {class: none, paths: []}

  - id: guide-more-shows-complete-catalog
    skill: dialectical-guide
    mode: contextual
    messages:
      - role: user
        content: "We have competing explanations and evidence. GUIDE."
      - role: assistant
        content: |-
          Based on where we are:

          [1] ACH — Compare competing hypotheses against evidence.
          [2] SOURCE-QUALITY — Rate source reliability and credibility.
          [3] COLLECTION GAPS — Identify missing evidence worth seeking.

          [MORE] Show all commands
    prompt: "MORE"
    environment: {fixture: conversation-in-prompt}
    expect_activation:
      include: [dialectical-guide]
      exclude: []
    expect:
      - "Returns every command in the canonical help catalog, not another shortlist."
      - "Waits for the user to name a command."
    forbid:
      - "Running ACH, SOURCE-QUALITY, COLLECTION GAPS, or any other command"
      - "Showing only commands judged relevant to the current context"
    expected_mutation: {class: none, paths: []}

  - id: guide-numeric-selection-runs-one-command
    skill: dialectical-guide
    mode: contextual
    messages:
      - role: user
        content: "We need to compare three explanations against six observations. GUIDE."
      - role: assistant
        content: |-
          Based on where we are:

          [1] ACH — Compare competing hypotheses against evidence.
          [2] SOURCE-QUALITY — Rate source reliability and credibility.
          [3] COLLECTION GAPS — Identify missing evidence worth seeking.

          [MORE] Show all commands
    prompt: "1"
    environment: {fixture: conversation-in-prompt, isolated_workers: unavailable}
    expect_activation:
      include: [dialectical-ach]
      exclude: [dialectical-guide, dialectical-source-quality, dialectical-collection-gaps]
    expect:
      - "Runs only ACH using the supplied explanations and evidence."
    forbid:
      - "Reranking the menu or asking for GUIDE again"
      - "Running either unselected alternative"
    expected_mutation: {class: none, paths: []}

  - id: guide-can-be-ignored
    skill: dialectical-guide
    mode: contextual
    messages:
      - role: user
        content: "We are exploring a design choice. GUIDE."
      - role: assistant
        content: |-
          Based on where we are:

          [1] RELEVANCE — Clarify inquiry purpose and scope.
          [2] THOUGHT EXPERIMENT — Explore implications through imagined conditions.
          [3] CHALLENGE — Seek weaknesses and disconfirming evidence.

          [MORE] Show all commands
    prompt: "Let's ignore those and keep talking about the design."
    environment: {fixture: conversation-in-prompt}
    expect_activation:
      include: []
      exclude: [dialectical-guide, dialectical-relevance, dialectical-thought-experiment, dialectical-challenge]
    expect:
      - "Continues ordinary conversation without executing or repeating the menu."
    forbid:
      - "Treating the prior menu as authorization"
      - "Recommending another command without a new GUIDE request"
    expected_mutation: {class: none, paths: []}

  - id: guide-thin-context-asks-once
    skill: dialectical-guide
    mode: explicit
    prompt: "GUIDE. There is no earlier conversation or supplied inquiry."
    environment: {fixture: none}
    expect_activation:
      include: [dialectical-guide]
      exclude: [dialectical-relevance]
    expect:
      - "Asks one brief question needed to rank three commands responsibly."
    forbid:
      - "Inventing an inquiry or displaying arbitrary recommendations"
      - "Launching RELEVANCE or showing the full catalog"
    expected_mutation: {class: none, paths: []}

  - id: guide-more-then-selects-one-from-full-catalog
    skill: dialectical-guide
    mode: contextual
    messages:
      - role: user
        content: "We have competing explanations and mixed evidence. GUIDE."
      - role: assistant
        content: |-
          Based on where we are:

          [1] ACH — Compare competing hypotheses against evidence.
          [2] SOURCE-QUALITY — Rate source reliability and credibility.
          [3] COLLECTION GAPS — Identify missing evidence worth seeking.

          [MORE] Show all commands
      - role: user
        content: "MORE"
      - role: assistant
        content: |-
          Here is the complete canonical command catalog, including:
          VERIFY — Check one empirical claim externally.

          Name one command to run it.
    prompt: "VERIFY whether the analytics definition changed last month."
    environment: {fixture: conversation-in-prompt, external_evidence: unavailable}
    expect_activation:
      include: [dialectical-verify]
      exclude: [dialectical-guide, dialectical-ach, dialectical-source-quality, dialectical-collection-gaps]
    expect:
      - "Runs only VERIFY for the command selected from the expanded catalog."
      - "States that verification is incomplete when authoritative external evidence is unavailable."
    forbid:
      - "Rerunning GUIDE, MORE, or one of the original top-three choices"
      - "Claiming the analytics definition was verified from conversation alone"
    expected_mutation: {class: none, paths: []}
