name: Validate source and evaluation harness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.2'
      - run: python scripts/validate_skills.py
      - run: python scripts/validate_plugin_package.py
      - run: python scripts/run_evals.py validate
      - run: python scripts/validate_qa.py
      - run: python -m unittest discover -s QA/tests
      - run: python scripts/package_plugin.py
